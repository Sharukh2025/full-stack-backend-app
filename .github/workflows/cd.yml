name: Backend CD (Render)

on:
  workflow_dispatch:  # manual deploy only

jobs:
  backend-cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render based on branch
        shell: bash
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
          RENDER_STAGING_HOOK: ${{ secrets.RENDER_STAGING_HOOK }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Manual deployment triggered for branch: $BRANCH"

          # Skip development branch
          if [ "$BRANCH" = "development" ]; then
            echo "Skipping deployment for development branch."
            exit 0
          fi

          # Deploy production or staging
          if [ "$BRANCH" = "production" ]; then
            echo "Deploying to Production"
            curl -X POST "$RENDER_PROD_HOOK"
          elif [ "$BRANCH" = "staging" ]; then
            echo "Deploying to Staging"
            curl -X POST "$RENDER_STAGING_HOOK"
          else
            echo "No deployment configured for branch: $BRANCH"
            exit 1
