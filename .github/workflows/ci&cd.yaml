name: Backend CI & Manual CD (Render)

on:
  workflow_dispatch:

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  continuous-delivery:
    name: Continuous Delivery (Render)
    runs-on: ubuntu-latest
    needs: continuous-integration

    steps:
      - name: Deploy to Render based on branch
        shell: bash
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
          RENDER_STAGING_HOOK: ${{ secrets.RENDER_STAGING_HOOK }}
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Manual deployment triggered for branch: $BRANCH"

          if [ "$BRANCH" = "production" ]; then
            echo "Deploying to Production"
            curl -X POST "$RENDER_PROD_HOOK"

          elif [ "$BRANCH" = "staging" ]; then
            echo "Deploying to Staging"
            curl -X POST "$RENDER_STAGING_HOOK"

          elif [ "$BRANCH" = "development" ]; then
            echo "Deploying to Development"
            curl -X POST "$RENDER_DEV_HOOK"

          else
            echo "No deployment configured for branch: $BRANCH"
            exit 1
          fi
