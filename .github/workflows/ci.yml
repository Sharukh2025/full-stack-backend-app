name: Backend CI

on:
  push:
    branches:
      - production
      - staging
      - development
  pull_request:
    branches:
      - production
      - staging
      - development
  workflow_dispatch:  # optional: allows manual CI trigger

jobs:
  backend-ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
